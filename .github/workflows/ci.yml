name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Run hardware-free unit suite
        env:
          MSX_RUN_INTEGRATION: "0"
        run: python -m unittest discover -s tests
      - name: Smoke-test installed MCP transports
        env:
          MSX_RUN_INTEGRATION: "0"
        run: python tools/release_check.py --runtime-smoke

  release-gate:
    name: Distribution and MCP release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Z80 assembler
        run: sudo apt-get update && sudo apt-get install --yes z80asm
      - name: Install project and build frontend
        run: python -m pip install -e . 'build>=1' 'setuptools>=77'
      - name: Validate source, distributions, agent suite, and MCP transports
        env:
          MSX_RUN_INTEGRATION: "0"
        run: make PYTHON=python release-check
